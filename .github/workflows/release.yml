name: Build Windows release

on:
  push:
    tags:
      - 'v*'
      - 'live'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Validate release tag before building
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content MySingingMonsterKaraokeStudio.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:EVENT_NAME -eq 'push') {
            $expected = 'v' + $version
            if ($env:RELEASE_TAG -cne 'live' -and $env:RELEASE_TAG -cne $expected) { throw "Tag must be live or $expected." }
          }
      - name: Run Windows smoke checks
        env:
          MSM_STUDIO_TEST_ROOT: ${{ runner.temp }}/MSMStudioTests
        run: |
          dotnet run --project tests/MySingingMonsterKaraokeStudio.SmokeTests/MySingingMonsterKaraokeStudio.SmokeTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Smoke checks failed; release will not be published.' }
      - name: Build fresh release EXE
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq 'push') {
            ./scripts/build-release.ps1 -Tag $env:RELEASE_TAG
          } else {
            ./scripts/build-release.ps1
          }
      - name: Keep downloadable build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: dist/MySingingMonsterKaraokeStudio.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Keep smoke results for diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: ${{ runner.temp }}/MSMStudioTests/**/results.json
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/tags/live' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: dist
      - name: Publish downloadable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $asset = Join-Path dist 'MySingingMonsterKaraokeStudio.exe'
          if (!(Test-Path -LiteralPath $asset -PathType Leaf)) { throw 'Expected MySingingMonsterKaraokeStudio.exe.' }
          if (@(Get-ChildItem -LiteralPath dist -File).Count -ne 1) { throw 'Expected exactly one release EXE.' }
          gh release create $env:RELEASE_TAG $asset --verify-tag --generate-notes --latest --title "My Singing Monster Karaoke Studio v$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed. Check release permissions or an existing release for this tag.' }
